services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: change-this-password
      MARIADB_DATABASE: student_db
      MARIADB_USER: student
      MARIADB_PASSWORD: change-this-user-password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:apache
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 32M
    depends_on:
      - db

volumes:
  db_data: